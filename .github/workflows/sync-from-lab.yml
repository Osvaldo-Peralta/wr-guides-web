# WR-GUIDES-WEB · Fase 6 — sync automático de contenido desde wr-lab.
#
# Qué hace: espeja wr-lab/reportes/*.md → content/ y el champion_winrates.csv
# del lab → content/winrates.csv, regenera el índice (npm run build valida de
# paso que el sitio compila con el contenido nuevo) y, si hubo cambios,
# commitea + pushea a main → Vercel redeploya sola. Al final re-siembra el
# catálogo de la API (opcional: requiere el secret ADMIN_TOKEN).
#
# Diseño "PULL" (este workflow vive en wr-guides-web y LEE el repo público
# wr-lab): no necesita tokens cruzados ni PAT — solo el GITHUB_TOKEN estándar.
#
# Cuándo corre:
#   · schedule: 08:35 y 20:35 UTC — 35 min después del patch-watch del lab
#     (08:00/20:00 UTC), que es cuando se refrescan los win rates.
#   · workflow_dispatch: botón "Run workflow" en la pestaña Actions (a demanda;
#     también fuerza la re-siembra de la API aunque no haya cambios de contenido).
#
# Nota: los pushes hechos con GITHUB_TOKEN no disparan otros workflows de
# GitHub (anti-recursión), pero SÍ llegan a Vercel (es una app externa).

name: Sync lab → web

on:
  schedule:
    - cron: "35 8 * * *"
    - cron: "35 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-lab
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wr-guides-web
        uses: actions/checkout@v4

      - name: Checkout wr-lab (fuente, solo lectura)
        uses: actions/checkout@v4
        with:
          repository: Osvaldo-Peralta/wr-lab
          path: .lab
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Espejar contenido del lab
        id: sync
        run: node scripts/sync-from-lab.mjs --lab .lab

      - name: Validar build (gen-index + next build)
        # Si el contenido nuevo rompe el sitio, el workflow FALLA acá y no se
        # pushea nada: producción queda intacta con la última versión buena.
        run: npm run build

      - name: Commit + push (solo si hay cambios)
        run: |
          git config user.name "wrg-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content public
          if git diff --cached --quiet; then
            echo "Sin cambios de contenido — no se commitea."
          else
            git commit -m "chore(sync): lab → web $(date -u '+%F %H:%M') UTC"
            git push
            echo "Cambios pusheados → Vercel redeploya automáticamente."
          fi

      - name: Re-sembrar catálogo de la API
        # Sin el secret ADMIN_TOKEN el script informa y sale 0 (no rompe el sync).
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WR_API: https://wr-guides-api.vercel.app
        run: node scripts/reseed-api.mjs
